  </g>

  <!-- Exhaust puffs -->
  <g>
    <circle cx="697" cy="497" r="5" fill="#dfe6ea">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="Translate" values="0 0; 0 -26" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="706" cy="500" r="4" fill="#cfd6dd">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="Translate" values="0 0; -8 -34" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Sloth -->
  <rect x="578" y="460" width="44" height="38" rx="8" fill="#6b5744"/>
  <rect x="578" y="466" width="44" height="20" rx="6" fill="#ff7f1a"/>
