<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa8e8"/>
      <stop offset="1" stop-color="#c9ecfa"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7c0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff7c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fdcf2"/>
      <stop offset="1" stop-color="#5ba7cf"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecc084"/>
      <stop offset="1" stop-color="#d69a52"/>
    </linearGradient>
    <linearGradient id="pileGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bd8250"/>
      <stop offset="1" stop-color="#8a5630"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66804a"/>
      <stop offset="1" stop-color="#41522c"/>
    </linearGradient>
    <linearGradient id="bucketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7dde3"/>
      <stop offset="1" stop-color="#8f989f"/>
    </linearGradient>
    <pattern id="caution" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="26" fill="#1d1d1d"/>
      <rect x="13" width="13" height="26" fill="#ffd23f"/>
    </pattern>
    <style>
      .cloud { animation: drift 60s ease-in-out infinite alternate; }
      .cloud2 { animation: drift 80s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(70px); } }
      .zz { animation: floatZ 3.4s ease-out infinite; }
      .zz2 { animation: floatZ 3.4s ease-out infinite; animation-delay: -1.1s; }
      .zz3 { animation: floatZ 3.4s ease-out infinite; animation-delay: -2.2s; }
      @keyframes floatZ { 0% { transform: translateY(10px); opacity: 0; } 20% { opacity: 0.95; } 100% { transform: translateY(-56px); opacity: 0; } }
    </style>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#skyGrad)"/>
  <circle cx="950" cy="130" r="85" fill="url(#sunGlow)"/>
  <circle cx="950" cy="130" r="46" fill="#fff0a0"/>
  <circle cx="950" cy="130" r="46" fill="none" stroke="#ffedb0" stroke-width="6"/>
  <g class="cloud" transform="translate(190,100)">
    <circle cx="0" cy="0" r="30" fill="#ffffff" opacity="0.95"/>
    <circle cx="32" cy="-14" r="22" fill="#ffffff" opacity="0.95"/>
    <circle cx="60" cy="-4" r="27" fill="#ffffff" opacity="0.95"/>
    <circle cx="30" cy="13" r="20" fill="#ffffff" opacity="0.95"/>
  </g>
  <g class="cloud2" transform="translate(560,64)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" opacity="0.9"/>
    <circle cx="22" cy="-10" r="15" fill="#ffffff" opacity="0.9"/>
    <circle cx="40" cy="-2" r="18" fill="#ffffff" opacity="0.9"/>
    <circle cx="22" cy="8" r="13" fill="#ffffff" opacity="0.9"/>
  </g>
  <g transform="translate(760,140)">
    <g>
      <animateMotion dur="28s" repeatCount="indefinite" path="M 0,0 Q 12,-8 24,0 Q 36,-8 48,0"/>
      <path d="M -12,0 Q -6,-7 0,0 Q 6,-7 12,0" stroke="#3b4a5f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Ground -->
  <rect x="0" y="560" width="1200" height="240" fill="url(#groundGrad)"/>
  <ellipse cx="80" cy="545" rx="42" ry="20" fill="url(#pileGrad)"/>
  <path d="M140,560 C140,500 210,462 288,455 C366,448 432,476 472,528 C498,550 535,558 600,560 L1200,560 L1200,800 L0,800 Z" fill="url(#pileGrad)"/>
