  <!-- Excavator arm: boom + stick + bucket -->
  <g id="armPivot" transform="translate(715,468)">
    <g id="armDig">
      <g transform="rotate(-14)">
        <rect x="-130" y="-11" width="130" height="22" rx="4" fill="url(#bodyGrad)" stroke="#37411f" stroke-width="2"/>
        <circle cx="-30" cy="0" r="4" fill="#566b39"/>
        <circle cx="-70" cy="0" r="4" fill="#566b39"/>
        <circle cx="-100" cy="0" r="4" fill="#566b39"/>
      </g>
      <g transform="translate(-126,33) rotate(-20)">
        <rect x="-110" y="-8" width="110" height="16" rx="3" fill="#566b39" stroke="#3c4a26" stroke-width="2"/>
        <rect x="-100" y="-11" width="60" height="9" rx="3" fill="#5f7440" stroke="#3c4a26" stroke-width="2"/>
      </g>
      <g transform="translate(-229,70.6)">
        <path d="M -16,-4 L 16,-4 L 12,8 L -12,8 Z" fill="url(#bucketGrad)" stroke="#7a828a" stroke-width="2"/>
        <line x1="-16" y1="-3" x2="-10" y2="0" stroke="#7a828a" stroke-width="2"/>
        <line x1="-5" y1="-3" x2="0" y2="0" stroke="#7a828a" stroke-width="2"/>
        <line x1="9" y1="-3" x2="15" y2="0" stroke="#7a828a" stroke-width="2"/>
      </g>
    </g>
