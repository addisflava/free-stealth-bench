  <rect x="40" y="518" width="100" height="12" rx="3" fill="url(#caution)"/>
  <ellipse cx="185" cy="548" rx="26" ry="13" fill="#9aa0a6"/>
  <ellipse cx="158" cy="556" rx="13" ry="7" fill="#8b929a"/>
  <ellipse cx="860" cy="620" rx="30" ry="16" fill="#5d8a52"/>
  <ellipse cx="950" cy="668" rx="38" ry="18" fill="#5d8a52"/>
  <ellipse cx="790" cy="690" rx="26" ry="13" fill="#6b9a5e"/>

  <!-- Traffic cones -->
