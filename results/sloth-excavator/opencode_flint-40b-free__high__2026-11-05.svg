    <path d="M -11,0 L 11,0 L -7,-20 L 7,-20 Z" fill="#ff6b1a" stroke="#d94f06" stroke-width="2"/>
    <rect x="-7" y="-11" width="14" height="6" rx="2" fill="#ffffff"/>
  </g>
  <g transform="translate(528,553) rotate(-40)">
