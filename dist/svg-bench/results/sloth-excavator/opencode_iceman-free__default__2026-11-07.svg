<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Sloth operating an excavator on a construction site</title>
  <desc id="desc">A cartoon sloth in a hard hat and high-visibility vest calmly digs with a yellow tracked excavator on a sunny construction site.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#79c8ff"/>
      <stop offset="65%" stop-color="#cfeeff"/>
      <stop offset="100%" stop-color="#f7f3d6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6a8"/>
      <stop offset="60%" stop-color="#ffd24d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6c27a"/>
      <stop offset="100%" stop-color="#c58b43"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8783a"/>
      <stop offset="100%" stop-color="#8a5526"/>
    </linearGradient>
    <linearGradient id="excBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd54a"/>
      <stop offset="100%" stop-color="#e6a800"/>
    </linearGradient>
    <linearGradient id="excDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b6168"/>
      <stop offset="100%" stop-color="#353a40"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfe6ee"/>
      <stop offset="100%" stop-color="#9aa7b3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff4ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8ecae6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="slothFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a97a"/>
      <stop offset="100%" stop-color="#9b774d"/>
    </linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8f1f"/>
      <stop offset="100%" stop-color="#e56f00"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <pattern id="caution" patternUnits="userSpaceOnUse" width="24" height="24" patternTransform="rotate(35)">
      <rect width="24" height="24" fill="#222"/>
      <rect width="12" height="24" fill="#f4c542"/>
    </pattern>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="42" ry="22" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="-32" cy="6" rx="26" ry="16" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="34" cy="8" rx="30" ry="18" fill="#ffffff" opacity="0.95"/>
      <ellipse cx="8" cy="-10" rx="28" ry="16" fill="#ffffff" opacity="0.95"/>
    </g>
    <g id="cone">
      <ellipse cx="0" cy="46" rx="24" ry="6" fill="#000" opacity="0.15"/>
      <polygon points="0,0 -18,44 18,44" fill="#ff6a00"/>
      <rect x="-13" y="18" width="26" height="6" fill="#fff"/>
      <rect x="-16" y="29" width="32" height="6" fill="#fff"/>
      <rect x="-22" y="44" width="44" height="6" rx="2" fill="#333"/>
    </g>
    <g id="bird">
      <path d="M-14 0 Q -7 -8 0 0 Q 7 -8 14 0" fill="none" stroke="#4a5568" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <style>
    .cloud1 { animation: drift 38s linear infinite; }
    .cloud2 { animation: drift 52s linear infinite; }
    .cloud3 { animation: drift 44s linear infinite; }
    @keyframes drift { from { transform: translateX(-180px); } to { transform: translateX(1380px); } }
    .birdFly { animation: birdCross 18s linear infinite; transform-origin: center; }
    @keyframes birdCross { 0% { transform: translate(-120px, 120px); } 50% { transform: translate(600px, 90px); } 100% { transform: translate(1320px, 130px); } }
    .wing { animation: flap 0.7s ease-in-out infinite; transform-origin: center; }
    @keyframes flap { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.55); } }
    .wheel { animation: roll 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes roll { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .steer { animation: steerTurn 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes steerTurn { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
    .dig { animation: digCycle 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 0px 0px; }
    @keyframes digCycle {
      0%,100% { transform: rotate(0deg); }
      20% { transform: rotate(8deg); }
      45% { transform: rotate(-6deg); }
      70% { transform: rotate(4deg); }
    }
    .stick { animation: stickCycle 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 0px 0px; }
    @keyframes stickCycle {
      0%,100% { transform: rotate(0deg); }
      20% { transform: rotate(18deg); }
      45% { transform: rotate(-22deg); }
      70% { transform: rotate(10deg); }
    }
    .bucket { animation: bucketCycle 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 0px 0px; }
    @keyframes bucketCycle {
      0%,100% { transform: rotate(0deg); }
      20% { transform: rotate(16deg); }
      45% { transform: rotate(-42deg); }
      58% { transform: rotate(-10deg); }
      75% { transform: rotate(24deg); }
    }
    .blink { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%,46%,50%,96%,100% { transform: scaleY(1); } 48%,98% { transform: scaleY(0.08); } }
    .zzz1 { animation: zfloat 3.8s ease-in infinite; }
    .zzz2 { animation: zfloat 3.8s ease-in infinite 1.2s; }
    .zzz3 { animation: zfloat 3.8s ease-in infinite 2.4s; }
    @keyframes zfloat {
      0% { transform: translate(0,0) scale(0.7); opacity: 0; }
      15% { opacity: 0.9; }
      100% { transform: translate(18px,-52px) scale(1.15); opacity: 0; }
    }
    .puff1 { animation: puff 3.2s ease-out infinite; }
    .puff2 { animation: puff 3.2s ease-out infinite 1.1s; }
    .puff3 { animation: puff 3.2s ease-out infinite 2.2s; }
    @keyframes puff {
      0% { transform: translate(0,0) scale(0.5); opacity: 0; }
      10% { opacity: 0.55; }
      100% { transform: translate(22px,-46px) scale(1.35); opacity: 0; }
    }
  </style>

  <!-- Sky -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#sky)"/>
  <g transform="translate(1040 110)">
    <circle r="78" fill="url(#sunGlow)"/>
    <circle r="34" fill="#ffe066"/>
  </g>

  <!-- Clouds -->
  <g class="cloud1" transform="translate(120 120)"><use href="#cloud"/></g>
  <g class="cloud2" transform="translate(420 170) scale(0.85)"><use href="#cloud"/></g>
  <g class="cloud3" transform="translate(760 95) scale(1.1)"><use href="#cloud"/></g>

  <!-- Birds -->
  <g class="birdFly">
    <g class="wing"><use href="#bird"/></g>
  </g>
  <g class="birdFly" style="animation-delay:-9s; opacity:0.7">
    <g transform="translate(0 40) scale(0.8)" class="wing"><use href="#bird"/></g>
  </g>

  <!-- Distant hills -->
  <path d="M0 520 C 180 470, 320 560, 520 520 S 860 460, 1200 510 L1200 800 L0 800 Z" fill="#dcc58e" opacity="0.55"/>
  <path d="M0 560 C 220 520, 420 590, 640 545 S 980 500, 1200 555 L1200 800 L0 800 Z" fill="#d3b67d" opacity="0.45"/>

  <!-- Ground -->
  <rect x="0" y="560" width="1200" height="240" fill="url(#ground)"/>
  <path d="M0 560 Q 300 545 600 562 T 1200 558 L1200 590 L0 590 Z" fill="#efd39a" opacity="0.45"/>

  <!-- Dirt pile -->
  <g filter="url(#softShadow)">
    <path d="M690 635 C 760 560, 860 545, 955 590 C 1015 615, 1065 650, 1095 690 L700 700 Z" fill="url(#dirt)"/>
    <path d="M760 640 C 815 585, 885 580, 945 615" fill="none" stroke="#7a4922" stroke-opacity="0.35" stroke-width="4"/>
    <ellipse cx="840" cy="655" rx="12" ry="6" fill="#7a4922" opacity="0.25"/>
    <ellipse cx="905" cy="668" rx="10" ry="5" fill="#7a4922" opacity="0.22"/>
  </g>

  <!-- Construction details -->
  <g transform="translate(170 640)"><use href="#cone"/></g>
  <g transform="translate(225 648) scale(0.9)"><use href="#cone"/></g>
  <g transform="translate(1035 676)">
    <ellipse cx="0" cy="10" rx="22" ry="8" fill="#000" opacity="0.12"/>
    <path d="M-18 8 C -10 -10, 10 -10, 18 8 Z" fill="#8d8f93"/>
    <path d="M-4 8 C 0 -6, 8 -6, 12 8 Z" fill="#a7aaae"/>
  </g>
  <g transform="translate(1085 690)">
    <ellipse cx="0" cy="8" rx="16" ry="6" fill="#000" opacity="0.12"/>
    <path d="M-13 6 C -6 -6, 7 -6, 14 6 Z" fill="#7d8085"/>
  </g>
  <g transform="translate(80 742)">
    <rect x="0" y="0" width="230" height="18" rx="4" fill="url(#caution)" stroke="#222" stroke-width="2"/>
    <rect x="96" y="-12" width="10" height="42" fill="#666"/>
  </g>

  <!-- Excavator group -->
  <g transform="translate(330 430)" filter="url(#softShadow)">
    <!-- Exhaust puffs -->
    <g transform="translate(196 18)" fill="#d9dde2">
      <circle class="puff1" cx="0" cy="0" r="9" opacity="0"/>
      <circle class="puff2" cx="0" cy="0" r="8" opacity="0"/>
      <circle class="puff3" cx="0" cy="0" r="7" opacity="0"/>
    </g>

    <!-- Tracks -->
    <g transform="translate(0 170)">
      <rect x="20" y="18" width="360" height="58" rx="29" fill="#2f343a"/>
      <rect x="28" y="26" width="344" height="42" rx="21" fill="#454b52"/>
      <!-- tread marks -->
      <g fill="#262a2f" opacity="0.9">
        <rect x="48" y="22" width="10" height="50" rx="2"/>
        <rect x="78" y="22" width="10" height="50" rx="2"/>
        <rect x="108" y="22" width="10" height="50" rx="2"/>
        <rect x="138" y="22" width="10" height="50" rx="2"/>
        <rect x="168" y="22" width="10" height="50" rx="2"/>
        <rect x="198" y="22" width="10" height="50" rx="2"/>
        <rect x="228" y="22" width="10" height="50" rx="2"/>
        <rect x="258" y="22" width="10" height="50" rx="2"/>
        <rect x="288" y="22" width="10" height="50" rx="2"/>
        <rect x="318" y="22" width="10" height="50" rx="2"/>
        <rect x="348" y="22" width="10" height="50" rx="2"/>
      </g>
      <!-- rollers/wheels -->
      <g>
        <g class="wheel" transform="translate(70 47)">
          <circle r="20" fill="#6a717a" stroke="#2f343a" stroke-width="4"/>
          <circle r="6" fill="#394046"/>
          <rect x="-2" y="-18" width="4" height="36" fill="#394046" rx="1"/>
          <rect x="-18" y="-2" width="36" height="4" fill="#394046" rx="1"/>
        </g>
        <g class="wheel" transform="translate(140 47)">
          <circle r="18" fill="#6a717a" stroke="#2f343a" stroke-width="4"/>
          <circle r="5" fill="#394046"/>
          <rect x="-2" y="-16" width="4" height="32" fill="#394046" rx="1"/>
          <rect x="-16" y="-2" width="32" height="4" fill="#394046" rx="1"/>
        </g>
        <g class="wheel" transform="translate(205 47)">
          <circle r="18" fill="#6a717a" stroke="#2f343a" stroke-width="4"/>
          <circle r="5" fill="#394046"/>
          <rect x="-2" y="-16" width="4" height="32" fill="#394046" rx="1"/>
          <rect x="-16" y="-2" width="32" height="4" fill="#394046" rx="1"/>
        </g>
        <g class="wheel" transform="translate(270 47)">
          <circle r="18" fill="#6a717a" stroke="#2f343a" stroke-width="4"/>
          <circle r="5" fill="#394046"/>
          <rect x="-2" y="-16" width="4" height="32" fill="#394046" rx="1"/>
          <rect x="-16" y="-2" width="32" height="4" fill="#394046" rx="1"/>
        </g>
        <g class="wheel" transform="translate(335 47)">
          <circle r="20" fill="#6a717a" stroke="#2f343a" stroke-width="4"/>
          <circle r="6" fill="#394046"/>
          <rect x="-2" y="-18" width="4" height="36" fill="#394046" rx="1"/>
          <rect x="-18" y="-2" width="36" height="4" fill="#394046" rx="1"/>
        </g>
      </g>
    </g>

    <!-- Rotating body platform -->
    <ellipse cx="210" cy="176" rx="74" ry="16" fill="#4b5259"/>
    <rect x="112" y="116" width="210" height="66" rx="12" fill="url(#excBody)" stroke="#d39000" stroke-width="2"/>

    <!-- Engine housing -->
    <rect x="120" y="82" width="92" height="42" rx="8" fill="url(#excBody)" stroke="#d39000" stroke-width="2"/>
    <g stroke="#c78400" stroke-width="3" opacity="0.7">
      <line x1="132" y1="94" x2="198" y2="94"/>
      <line x1="132" y1="104" x2="198" y2="104"/>
      <line x1="132" y1="114" x2="198" y2="114"/>
    </g>
    <!-- exhaust pipe -->
    <rect x="190" y="36" width="12" height="50" rx="4" fill="#596068"/>
    <rect x="186" y="32" width="20" height="10" rx="3" fill="#3f454b"/>

    <!-- Arm assembly -->
    <g transform="translate(292 126)">
      <g class="dig" transform="rotate(-18)">
        <!-- boom -->
        <path d="M0 -8 L165 -58 L178 -34 L16 18 Z" fill="url(#excBody)" stroke="#d39000" stroke-width="2"/>
        <circle cx="8" cy="4" r="9" fill="#7a8086" stroke="#4e545a"/>
        <g class="stick" transform="translate(168 -46) rotate(48)">
          <!-- stick -->
          <path d="M0 -7 L122 38 L112 58 L-8 14 Z" fill="url(#excBody)" stroke="#d39000" stroke-width="2"/>
          <circle cx="4" cy="3" r="8" fill="#7a8086" stroke="#4e545a"/>
          <g class="bucket" transform="translate(116 48) rotate(-38)">
            <!-- hydraulic hint -->
            <rect x="-56" y="-2" width="54" height="6" rx="3" fill="#808891"/>
            <!-- bucket -->
            <path d="M0 0 L58 16 L46 58 L-12 44 Z" fill="#6e757d" stroke="#495056" stroke-width="2"/>
            <path d="M58 16 L68 24 L56 64 L46 58 Z" fill="#596068"/>
            <g fill="#dfe6ee" stroke="#98a3ad" stroke-width="1">
              <polygon points="-8,43 2,45 -2,58 -12,56"/>
              <polygon points="8,47 18,49 14,62 4,60"/>
              <polygon points="24,51 34,53 30,66 20,64"/>
              <polygon points="40,55 50,57 46,70 36,68"/>
            </g>
            <circle cx="2" cy="8" r="6" fill="#808891" stroke="#4e545a"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Cab -->
    <g transform="translate(214 34)">
      <rect x="0" y="44" width="120" height="104" rx="10" fill="url(#excBody)" stroke="#d39000" stroke-width="2"/>
      <path d="M10 52 L110 52 L104 14 L18 14 Z" fill="url(#glass)" stroke="#7aa9bf" stroke-width="2"/>
      <line x1="60" y1="14" x2="60" y2="52" stroke="#7aa9bf" stroke-width="2" opacity="0.7"/>
      <rect x="8" y="52" width="104" height="6" fill="#e0a100" opacity="0.9"/>
      <!-- interior dashboard -->
      <rect x="14" y="108" width="92" height="22" rx="5" fill="#3f4650"/>
      <circle cx="34" cy="119" r="3" fill="#7dff8a"/>
      <circle cx="45" cy="119" r="3" fill="#7dc8ff"/>
      <!-- steering wheel -->
      <g class="steer" transform="translate(82 102)">
        <circle r="16" fill="none" stroke="#2b3036" stroke-width="5"/>
        <circle r="4" fill="#2b3036"/>
        <rect x="-13" y="-2" width="26" height="4" rx="2" fill="#2b3036"/>
        <rect x="-2" y="-13" width="4" height="26" rx="2" fill="#2b3036"/>
      </g>

      <!-- Sloth -->
      <g transform="translate(40 62)">
        <!-- Zzz -->
        <g fill="#5f6f86" font-family="Arial, Helvetica, sans-serif" font-weight="700">
          <text class="zzz1" x="44" y="2" font-size="14" opacity="0">Z</text>
          <text class="zzz2" x="44" y="2" font-size="16" opacity="0">Z</text>
          <text class="zzz3" x="44" y="2" font-size="18" opacity="0">z</text>
        </g>
        <!-- body / vest -->
        <ellipse cx="24" cy="56" rx="24" ry="20" fill="url(#slothFur)"/>
        <path d="M4 48 C 4 38, 14 32, 24 32 C 34 32, 44 38, 44 48 L44 64 C 44 70, 39 74, 33 74 L15 74 C 9 74, 4 70, 4 64 Z" fill="url(#vest)"/>
        <rect x="14" y="46" width="20" height="5" fill="#c7d7e8" opacity="0.85"/>
        <rect x="10" y="58" width="8" height="4" fill="#c7d7e8" opacity="0.85"/>
        <rect x="30" y="58" width="8" height="4" fill="#c7d7e8" opacity="0.85"/>
        <!-- arm to steering wheel -->
        <path d="M38 54 C 52 54, 60 44, 70 40" fill="none" stroke="url(#slothFur)" stroke-width="11" stroke-linecap="round"/>
        <g transform="translate(70 40)" stroke="#7d5a39" stroke-width="2" stroke-linecap="round">
          <line x1="0" y1="0" x2="7" y2="-2"/>
          <line x1="0" y1="3" x2="8" y2="4"/>
          <line x1="-1" y1="-3" x2="5" y2="-7"/>
        </g>
        <!-- head -->
        <ellipse cx="24" cy="24" rx="26" ry="22" fill="url(#slothFur)"/>
        <ellipse cx="24" cy="29" rx="18" ry="14" fill="#ead8bf"/>
        <!-- eye patches -->
        <ellipse cx="12" cy="23" rx="10" ry="8" fill="#6b4f35"/>
        <ellipse cx="36" cy="23" rx="10" ry="8" fill="#6b4f35"/>
        <!-- eyes -->
        <g class="blink">
          <path d="M6 23 Q 12 19 18 23" fill="none" stroke="#2f2418" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M30 23 Q 36 19 42 23" fill="none" stroke="#2f2418" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <!-- nose and smile -->
        <ellipse cx="24" cy="29" rx="3.2" ry="2.4" fill="#5b4330"/>
        <path d="M18 34 Q 24 38 30 34" fill="none" stroke="#5b4330" stroke-width="2" stroke-linecap="round"/>
        <!-- hard hat -->
        <g transform="translate(0 -2)">
          <ellipse cx="24" cy="10" rx="24" ry="6" fill="#f0c200"/>
          <path d="M4 10 C 6 -4, 42 -4, 44 10 Z" fill="#ffd84d" stroke="#d3a800" stroke-width="2"/>
          <rect x="18" y="-2" width="12" height="6" rx="2" fill="#f0c200" stroke="#d3a800"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Small foreground tufts -->
  <g fill="#9c6a32" opacity="0.45">
    <path d="M520 690 q8 -18 16 0"/>
    <path d="M545 696 q8 -14 16 0"/>
    <path d="M1120 718 q8 -14 16 0"/>
  </g>
</svg>
